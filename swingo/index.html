<!DOCTYPE html>
<html>

<head>
	<meta charset="UTF-8">
	<title>Swingo</title>

	<base href="https://cdn.jsdelivr.net/gh/nawsif/host@main/swingo/">

	<script>
(() => {
	const CDN_BASE =
		"https://cdn.jsdelivr.net/gh/tinklehost/hosting@main/swingo/";

	const OriginalWorker = window.Worker;

	window.Worker = function(url, options = {}) {
		const originalURL = String(url);

		/*
			Fix Construct's dispatchworker.js.

			We CANNOT do:

			new Worker("https://cdn.jsdelivr.net/...")

			because Worker() requires its initial script to be
			same-origin.

			Instead create a local blob worker which imports
			the CDN worker.
		*/
		if (
			originalURL.includes("/scripts/dispatchworker.js") ||
			originalURL.endsWith("scripts/dispatchworker.js")
		) {
			const realURL =
				CDN_BASE + "scripts/dispatchworker.js";

			console.log(
				"[Swingo Worker Fix]",
				originalURL,
				"->",
				realURL
			);

			let wrapperCode;

			if (options && options.type === "module") {

				// Module Worker
				wrapperCode =
					`import "${realURL}";`;

			} else {

				// Classic Worker
				wrapperCode =
					`importScripts("${realURL}");`;
			}

			const blob = new Blob(
				[wrapperCode],
				{
					type: "application/javascript"
				}
			);

			const blobURL =
				URL.createObjectURL(blob);

			const worker =
				new OriginalWorker(
					blobURL,
					options
				);

			/*
				Don't revoke instantly because the browser
				still needs the blob during worker startup.
			*/
			setTimeout(() => {
				URL.revokeObjectURL(blobURL);
			}, 10000);

			return worker;
		}

		return new OriginalWorker(
			url,
			options
		);
	};

	window.Worker.prototype =
		OriginalWorker.prototype;

	console.log(
		"[Swingo Worker Fix] Worker interceptor installed"
	);
})();
</script>
