<!doctype html>
<html lang="en-us">

<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no, minimum-scale=1, maximum-scale=1">

  <title>Balatro</title>

  <link rel="stylesheet" type="text/css" href="theme/love.css">

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }

    #game-container {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      background: #000;
      overflow: hidden;
    }

    #canvas,
    #loadingCanvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
    }

    #canvas {
      visibility: hidden;
    }

    /* Tinkle Games intro */
    #port-intro {
      position: fixed;
      inset: 0;
      z-index: 999999;

      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      overflow: hidden;

      opacity: 1;
      transition: opacity 0.7s ease;
    }

    #port-intro-text {
      text-align: center;
      color: white;
      font-family: Arial, sans-serif;

      opacity: 0;
      transform: scale(0.75);

      animation: portIntro 2.6s ease forwards;
    }

    #port-intro-text span {
      display: block;

      font-size: 18px;
      letter-spacing: 8px;

      margin-bottom: 12px;
    }

    #port-intro-text strong {
      display: block;

      font-size: clamp(42px, 8vw, 90px);
      letter-spacing: 4px;
    }

    @keyframes portIntro {
      0% {
        opacity: 0;
        transform: scale(0.75);
        filter: blur(10px);
      }

      25% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }

      70% {
        opacity: 1;
        transform: scale(1);
        filter: blur(0);
      }

      100% {
        opacity: 0;
        transform: scale(1.08);
        filter: blur(6px);
      }
    }
  </style>
</head>

<body>

  <!-- Port intro -->
  <div id="port-intro">
    <div id="port-intro-text">
      <span>WEB PORT BY</span>
      <strong>TINKLE GAMES</strong>
    </div>
  </div>

  <!-- Game -->
  <div id="game-container">

    <canvas
      id="loadingCanvas"
      oncontextmenu="event.preventDefault()"
      width="800"
      height="600">
    </canvas>

    <canvas
      id="canvas"
      oncontextmenu="event.preventDefault()">
    </canvas>

  </div>

  <script type="text/javascript">

    function resizeGame() {
      const canvas = document.getElementById("canvas");

      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    window.addEventListener("resize", resizeGame);

    resizeGame();


    var loadingContext =
      document.getElementById("loadingCanvas").getContext("2d");


    function drawLoadingText(text) {
      var canvas = loadingContext.canvas;

      loadingContext.fillStyle = "rgb(142, 195, 227)";
      loadingContext.fillRect(
        0,
        0,
        canvas.width,
        canvas.height
      );

      loadingContext.font = "2em Arial";
      loadingContext.textAlign = "center";

      loadingContext.fillStyle = "rgb(11, 86, 117)";

      loadingContext.fillText(
        text,
        canvas.width / 2,
        canvas.height / 2
      );
    }


    window.onload = function () {
      window.focus();
    };


    window.onclick = function () {
      window.focus();
    };


    window.addEventListener(
      "keydown",
      function (e) {

        if ([32, 37, 38, 39, 40].indexOf(e.keyCode) > -1) {
          e.preventDefault();
        }

      },
      false
    );


    var Module = {

      arguments: ["./game.love"],

      INITIAL_MEMORY: 536870912,

      printErr: console.error.bind(console),

      canvas: (function () {

        var canvas =
          document.getElementById("canvas");

        canvas.addEventListener(
          "webglcontextlost",
          function (e) {

            alert(
              "WebGL context lost. You will need to reload the page."
            );

            e.preventDefault();

          },
          false
        );

        return canvas;

      })(),


      setStatus: function (text) {

        if (text) {

          drawLoadingText(text);

        } else if (Module.remainingDependencies === 0) {

          document.getElementById(
            "loadingCanvas"
          ).style.display = "none";

          document.getElementById(
            "canvas"
          ).style.visibility = "visible";
        }

      },


      totalDependencies: 0,

      remainingDependencies: 0,


      monitorRunDependencies: function (left) {

        this.remainingDependencies = left;

        this.totalDependencies =
          Math.max(
            this.totalDependencies,
            left
          );

        Module.setStatus(
          left
            ? "Preparing... (" +
              (this.totalDependencies - left) +
              "/" +
              this.totalDependencies +
              ")"
            : "All downloads complete."
        );
      }
    };


    Module.setStatus("Downloading...");


    window.onerror = function () {

      Module.setStatus(
        "Exception thrown, see JavaScript console"
      );

      Module.setStatus = function (text) {

        if (text) {
          Module.printErr(
            "[post-exception status] " + text
          );
        }

      };
    };


    var applicationLoad = function () {
      Love(Module);
    };

  </script>


  <script
    type="text/javascript"
    src="game.js">
  </script>


  <script
    async
    type="text/javascript"
    src="love.js"
    onload="applicationLoad(this)">
  </script>


  <script>
    window.addEventListener("load", function () {

      setTimeout(function () {

        const intro =
          document.getElementById("port-intro");

        if (!intro) return;

        intro.style.opacity = "0";

        setTimeout(function () {
          intro.remove();
        }, 700);

      }, 2600);

    });
  </script>

</body>
</html>
