<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <base href="https://cdn.jsdelivr.net/gh/nawsif/host@main/rounds/">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#414141">
  <title>ROUNDS | Tinkle Games</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    *{box-sizing:border-box} html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#414141} html{height:100dvh} body{height:100dvh}
    #unity-container,#unity-canvas{position:absolute;inset:0;width:100%;height:100%;display:block} #unity-container{overflow:hidden}
    #unity-canvas{background:#151515;outline:0;touch-action:none}
    #web-start{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:#02041b;color:#f49812;font-family:Arial,sans-serif;text-align:center}
    #web-start h1{font-size:clamp(42px,9vw,72px);letter-spacing:4px;margin:0 0 24px}
    #web-play{padding:15px 70px;background:#f49812;color:#02041b;border:0;font-size:26px;font-weight:700;cursor:pointer}
    #web-play:disabled{opacity:.55;cursor:default}
    #web-start p{color:#ddd}
    #tinkle-loader{position:fixed;inset:0;z-index:70;background:#414141;display:none;flex-direction:column;align-items:center;justify-content:center;gap:22px;text-align:center;color:#f6cb68;transition:opacity .7s ease,visibility .7s ease;font-family:'Orbitron',Arial,sans-serif}
    #tinkle-loader.visible{display:flex} #tinkle-loader.fading{opacity:0;visibility:hidden;pointer-events:none}
    .tinkle-diamond{width:48px;height:48px;border:3px solid #efbd47;transform:rotate(45deg);box-shadow:0 0 18px #dca12877;animation:diamond-pulse 1.5s ease-in-out infinite;margin:0 0 12px}
    @keyframes diamond-pulse{0%,100%{opacity:.55;scale:.9}50%{opacity:1;scale:1.1}}
    .tinkle-title{font-weight:900;font-size:clamp(27px,6vw,53px);letter-spacing:.1em;background:linear-gradient(180deg,#fff2af 0%,#f6c55d 40%,#b97613 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
    .tinkle-track{width:min(365px,80vw);height:10px;border:1px solid #d6a538;background:#252525;border-radius:15px;overflow:hidden;margin-top:8px}
    #tinkle-progress{height:100%;width:0;background:linear-gradient(90deg,#b67a19,#ffdf70);transition:width .17s linear;box-shadow:0 0 12px #ffdc6d}
    #tinkle-percent{font-size:15px;letter-spacing:.15em;color:#ffcf65}
    #tinkle-status{font-family:Arial,sans-serif;font-size:13px;color:#dedede;max-width:85vw}
    #unity-warning{position:fixed;z-index:100;top:12px;left:50%;transform:translateX(-50%);max-width:min(700px,95vw);color:white;font:14px Arial,sans-serif}
    #unity-warning>div{padding:12px;border-radius:6px;background:#962d28;margin-bottom:6px;overflow-wrap:anywhere}
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="web-start"><h1>ROUNDS</h1><button id="web-play">PLAY</button><p>Ported by Tinkle v1.1.2</p></div>
    <div id="tinkle-loader" role="status" aria-live="polite">
      <div class="tinkle-diamond"></div>
      <div class="tinkle-title">TINKLE GAMES</div>
      <div class="tinkle-track"><div id="tinkle-progress"></div></div>
      <div id="tinkle-percent">0%</div>
      <div id="tinkle-status">Preparing game...</div>
    </div>
    <div id="unity-warning"></div>
  </div>
  <script>
  (() => {
    const buildUrl = 'Build';
    const canvas = document.getElementById('unity-canvas');
    const start = document.getElementById('web-start');
    const play = document.getElementById('web-play');
    const loader = document.getElementById('tinkle-loader');
    const bar = document.getElementById('tinkle-progress');
    const percent = document.getElementById('tinkle-percent');
    const status = document.getElementById('tinkle-status');
    const warnings = document.getElementById('unity-warning');
    const blobUrls = [];
    let lastProgress = 0;
    function progress(value, message) {
      lastProgress = Math.max(lastProgress, Math.min(100, value));
      bar.style.width = lastProgress + '%';
      percent.textContent = Math.floor(lastProgress) + '%';
      if (message) status.textContent = message;
    }
    function warning(message, type = 'error') {
      const div = document.createElement('div');
      div.textContent = message;
      if (type === 'warning') div.style.background = '#9b740d';
      warnings.appendChild(div);
      if (type !== 'error') setTimeout(() => div.remove(), 5000);
    }
    async function mergedBlob(baseName, suffixes, mimeType, onPart) {
      // Promise.all preserves the declared suffix order, irrespective of download completion order.
      let completed = 0;
      const blobs = await Promise.all(suffixes.map(async suffix => {
        const url = `${buildUrl}/${baseName}.part-${suffix}`;
        const response = await fetch(url);
        if (!response.ok) throw new Error(`Failed to download ${url} (HTTP ${response.status})`);
        const blob = await response.blob();
        onPart(++completed, suffixes.length);
        return blob;
      }));
      const url = URL.createObjectURL(new Blob(blobs, {type:mimeType}));
      blobUrls.push(url);
      return url;
    }
    const config = {
      dataUrl: '',
      frameworkUrl: `${buildUrl}/WebBuild.framework.js`,
      codeUrl: '',
      streamingAssetsUrl: 'StreamingAssets',
      companyName: 'Landfall Games',
      productName: 'ROUNDS',
      productVersion: '1.1.2',
      showBanner: warning
    };
    async function startGame() {
      play.disabled = true;
      loader.classList.add('visible');
      loader.classList.remove('fading');
      progress(0, 'Downloading game files...');
      try {
        let done = 0;
        const onPart = () => progress((++done / 11) * 65, `Downloading split files (${done}/11)...`);
        [config.dataUrl, config.codeUrl] = await Promise.all([
          mergedBlob('WebBuild.data', ['aa','ab','ac','ad','ae','af'], 'application/octet-stream', onPart),
          mergedBlob('WebBuild.wasm', ['aa','ab','ac','ad','ae'], 'application/wasm', onPart)
        ]);
        progress(65, 'Starting Unity...');
        if (typeof createUnityInstance !== 'function') throw new Error('Unity loader did not initialize.');
        const unityInstance = await createUnityInstance(canvas, config, p => progress(65 + p * 35, 'Loading ROUNDS...'));
        progress(100, 'Ready!');
        start.remove();
        loader.classList.add('fading');
        setTimeout(() => { loader.style.display = 'none'; }, 750);
      } catch (err) {
        console.error(err);
        warning(err.message || String(err));
        status.textContent = 'Loading failed. Press RETRY to try again.';
        loader.classList.remove('visible');
        loader.style.display = 'none';
        play.textContent = 'RETRY';
        play.disabled = false;
        blobUrls.splice(0).forEach(url => URL.revokeObjectURL(url));
      }
    }
    play.addEventListener('click', () => {
      // Fullscreen requests require a direct user gesture, before any awaits.
      if (document.fullscreenEnabled && !document.fullscreenElement) {
        document.documentElement.requestFullscreen({ navigationUI: 'hide' }).catch(() => {});
      }
      startGame();
    });
    const script = document.createElement('script');
    script.src = `${buildUrl}/WebBuild.loader.js`;
    script.onerror = () => { warning('Failed to load Build/WebBuild.loader.js'); play.disabled = true; };
    document.body.appendChild(script);
    // Blob URLs stay alive while Unity runs, since engine code may refer to them after initialization.
    window.addEventListener('pagehide', () => blobUrls.forEach(url => URL.revokeObjectURL(url)));
  })();
  </script>
</body>
</html>
